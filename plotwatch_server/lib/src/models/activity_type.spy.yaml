### What happened on a project, shown in the activity feed (FEED). Streamed
### from M5; written from M2 on.
enum: ActivityType
serialized: byName
values:
  - projectCreated
  - projectUpdated
  - projectStatusChanged
  - siteProposed
  - siteProposalRejected
  # A proposal was validated: the site was set or moved.
  - siteChanged
  - memberJoined
  - memberRemoved
