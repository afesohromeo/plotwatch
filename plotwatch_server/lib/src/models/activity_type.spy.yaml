### What happened on a project, shown in the activity feed (FEED). Streamed
### from M5; written from M2 on.
enum: ActivityType
serialized: byName
values:
  - projectCreated
  - projectUpdated
  - projectStatusChanged
  - siteProposed
  - siteProposalRejected
  # A proposal was validated (the site was set or moved), or the owner
  # edited the radius or address (doc/04b H-3).
  - siteChanged
  - memberJoined
  - memberRemoved
  # doc/04b H-4
  - memberRoleChanged
  # A stage was added, edited, deleted or moved, or a plan was created
  # (doc/04c M3-11).
  - stagePlanChanged
  - stageStarted
  # doc/04d
  - evidenceCaptured
  - evidenceRetracted
  # doc/04e
  - stageSubmitted
  - stageApproved
  - stageChangesRequested
  - progressUpdatePosted
  # The ledger (doc/04f M6-9)
  - fundReleased
  - releaseConfirmed
  - expenseRecorded
  - entryReversed
