### Error codes sent to the client inside [AppException].
###
### The server never sends display text: the client maps each code to a
### localized message (one ARB key per code, `_standards/14` §2).
### Auth codes are set by the client's ApiErrorHandler from the auth module's
### own exceptions (`_standards/14` §2.3.1).
enum: AppErrorCode
serialized: byName
values:
  - permissionDenied
  # Profile (decision M1-2)
  - invalidFullName
  - invalidCountryCode
  - invalidLocale
  # Projects and site (doc/04b, group A)
  - projectNotFound
  - invalidProjectName
  - invalidProjectDescription
  - invalidCurrencyCode
  - invalidProjectDates
  - invalidStatusTransition
  - invalidSiteLocation
  - invalidSiteRadius
  # Membership
  - invitationNotFound
  - invitationExpired
  - invitationUsed
  - invalidInvitationRole
  - alreadyMember
  - cannotRemoveOwner
  # Set by the client from the auth module's exceptions
  - authInvalidCredentials
  - authTooManyAttempts
  - authRequestExpired
  - authRequestInvalid
  - authPasswordPolicy
  - authUserBlocked
  - authUnknown
