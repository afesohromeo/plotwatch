### Error codes sent to the client inside [AppException].
###
### The server never sends display text: the client maps each code to a
### localized message (one ARB key per code, `_standards/14` §2).
### Auth codes are set by the client's ApiErrorHandler from the auth module's
### own exceptions (`_standards/14` §2.3.1).
enum: AppErrorCode
serialized: byName
values:
  - permissionDenied
  # Profile (decision M1-2)
  - invalidFullName
  - invalidCountryCode
  - invalidLocale
  # Projects and site (doc/04b, group A)
  - projectNotFound
  - invalidProjectName
  - invalidProjectDescription
  - invalidCurrencyCode
  - invalidProjectDates
  - invalidStatusTransition
  - invalidSiteLocation
  - invalidSiteRadius
  # Membership
  - invitationNotFound
  - invitationExpired
  - invitationUsed
  - invalidInvitationRole
  - alreadyMember
  - cannotRemoveOwner
  - memberNotFound
  # Role change (doc/04b H-4)
  - cannotChangeOwnerRole
  - invalidMemberRole
  # Site localization (doc/04b, group D)
  - siteProposalNotFound
  - siteProposalNotPending
  - siteAccuracyTooLow
  - siteMockLocation
  # Site edit (doc/04b H-3)
  - siteNotFound
  # Stages (doc/04c)
  - stageNotFound
  - stageLocked
  - invalidStageName
  - invalidStageDescription
  - invalidBudget
  - invalidStageDates
  - invalidChecklistItem
  - tooManyStages
  - tooManyChecklistItems
  - invalidStageOrder
  - stagePlanNotEmpty
  - invalidStageTransition
  - projectNotActive
  - projectNotEditable
  # Captures (doc/04d)
  - evidenceNotFound
  - checklistItemNotFound
  - evidenceNotCommitted
  - uploadMissing
  - evidenceFileTooLarge
  - invalidEvidenceMetadata
  - evidenceAlreadyRetracted
  - notYourCapture
  - checklistItemHasEvidence
  # Review loop and updates (doc/04e)
  - checklistIncomplete
  - reviewCommentRequired
  - notificationNotFound
  - invalidProgressUpdate
  - updateNotFound
  # The ledger (doc/04f)
  - invalidLedgerEntry
  - ledgerEntryNotFound
  - alreadyReversed
  - alreadyConfirmed
  - notEntryAuthor
  # One account per email (doc/04g, AUTH-04b)
  - emailUsesGoogle
  # Free text longer than its limit
  - textTooLong
  # Set by the client from the auth module's exceptions
  - authInvalidCredentials
  - authTooManyAttempts
  - authRequestExpired
  - authRequestInvalid
  - authPasswordPolicy
  - authUserBlocked
  - authUnknown
