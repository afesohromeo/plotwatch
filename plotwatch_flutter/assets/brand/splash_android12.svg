    <path d="M20.5 25.5L32 15.8l11.5 9.7" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24.5" y="24.5" width="15" height="11.5" rx="1.5" stroke="#FFFFFF" stroke-width="3.4"/>
    <rect x="27.5" y="29.3" width="9" height="3" rx="1.5" fill="#E8A27E"/>
  </g>
</svg>
