name: plotwatch_flutter
description: Plotwatch app (Android, iOS, web), built on flutter_bloc_kit.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # usePathUrlStrategy: web links without "#" (decision M2-8)
  flutter_web_plugins:
    sdk: flutter

  # Serverpod (pinned, as generated by serverpod create)
  plotwatch_client:
    path: ../plotwatch_client
  serverpod_flutter: 4.0.3
  serverpod_auth_idp_flutter: 4.0.3
  # Email sign-in exceptions mapped by ApiErrorHandler (not re-exported elsewhere)
  serverpod_auth_idp_client: 4.0.3
  # Google sign-in on phones (doc/04g step 4); the version the auth package uses
  google_sign_in: ^7.2.0
  # Opens the privacy policy in the browser (doc/04g step 6)
  url_launcher: ^6.3.1

  # From flutter_bloc_kit
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  flutter_bloc: ^9.0.0
  freezed_annotation: ^3.1.0
  intl: any
  go_router: ^17.0.1
  infinite_scroll_pagination: ^4.0.0
  flutter_native_splash: ^2.4.4
  intl_phone_field: ^3.2.0
  flutter_secure_storage: ^10.0.0
  app_theme_kit: ^0.1.0
  web: ^1.1.1
  flutter_svg: ^2.3.0
  share_plus: 13.3.1
  geolocator: ^14.0.1
  google_maps_flutter: ^2.18.2
  camera: ^0.12.1
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used for agents to drive the app through the Dart MCP (lib/driver.dart)
  flutter_driver:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.16.1
  # 4.0.1, not 4.0.2: in the workspace, the server's `test` package caps
  # analyzer below 14, and freezed 4.0.2 needs analyzer 14.
  freezed: ^4.0.1
  flutter_gen_runner: ^5.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

# Serverpod 4 auth needs flutter_secure_storage 10+ on Android (template override).
dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config.json
    # Logo for the welcome page; the other assets/brand files are inputs of
    # the icon and splash generators, not bundled.
    - assets/brand/mark_full.svg

  # Design system font (doc/05-design-system.md §3), bundled so it works
  # offline. SIL Open Font License: assets/fonts/Manrope-OFL.txt.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

fluttergen:
  output: lib/src/generated
  line_length: 120

  integrations:
    flutter_svg: true
